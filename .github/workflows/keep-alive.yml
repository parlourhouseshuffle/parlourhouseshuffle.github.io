# Free Supabase projects pause after a week with no visitors (e.g. the off-season).
# This pings the database every Monday so the site never goes to sleep.
name: keep-alive
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          KEY=$(grep -o 'eyJ[^"]*' <<< "$(curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/config.js)")
          curl -sf -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "https://mtoizvfknvmsmpgtxhnt.supabase.co/rest/v1/teams?select=code&limit=1"
